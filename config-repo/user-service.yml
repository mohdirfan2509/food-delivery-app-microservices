server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/userdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Safe Development Seed Configuration for Initial Administrator Account
app:
  admin:
    email: ${ADMIN_EMAIL:admin@foodapp.com}
    password: ${ADMIN_PASSWORD:Admin@1234}
    name: ${ADMIN_NAME:System Administrator}
    phone: ${ADMIN_PHONE:9876543210}
