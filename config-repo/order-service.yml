server:
  port: ${ORDER_SERVICE_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/orderdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ORDER_DB_USERNAME:root}
    password: ${ORDER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Declarative Feign Client target URLs
services:
  food:
    url: ${FOOD_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

# Kafka topic configuration
app:
  kafka:
    topics:
      order-created: ${KAFKA_TOPIC_ORDER_CREATED:order-created}
