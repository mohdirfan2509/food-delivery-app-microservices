services:
  # ============================================================================
  # MySQL Database (Multi-tenant schema: userdb, fooddb, orderdb, paymentdb, notificationdb)
  # ============================================================================
  mysql:
    image: mysql:8.4
    container_name: food-delivery-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # Map container 3306 to host 3307 by default to avoid Ubuntu native MySQL (3306) conflict
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - food_delivery_mysql_data:/var/lib/mysql
      - ./init-scripts/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - food-delivery-network

  # ============================================================================
  # Redis In-Memory Cache (Catalog & Food Items)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    ports:
      # Map container 6379 to host 6380 by default to avoid Ubuntu native Redis (6379) conflict
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - food_delivery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - food-delivery-network

  # ============================================================================
  # Apache Kafka (KRaft mode - Single Broker without Zookeeper)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.1
    container_name: food-delivery-kafka
    restart: unless-stopped
    ports:
      # Host connects via localhost:9092 (PLAINTEXT listener mapped to container port 9094)
      - "${KAFKA_HOST_PORT:-9092}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Listeners: PLAINTEXT on 9094 for host/IntelliJ, DOCKER on 9092 for internal network, CONTROLLER on 9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,DOCKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_HOST_PORT:-9092},DOCKER://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - food_delivery_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - food-delivery-network

  # ============================================================================
  # Kafka Topic Initializer (Idempotent creation of order-created topic)
  # ============================================================================
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: food-delivery-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order-created --partitions 1 --replication-factor 1 && echo 'Topic order-created is ready'"
    networks:
      - food-delivery-network

# ==============================================================================
# Volumes & Networks
# ==============================================================================
volumes:
  food_delivery_mysql_data:
    driver: local
  food_delivery_redis_data:
    driver: local
  food_delivery_kafka_data:
    driver: local

networks:
  food-delivery-network:
    driver: bridge
